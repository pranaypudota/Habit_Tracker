[project]
name = "habit-tracker-backend"
version = "0.1.0"
description = "Local-first Habit & Expense Tracker — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
    "greenlet>=3.0.0",
    "cachetools>=5.3.0",
    "orjson>=3.11.7",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
